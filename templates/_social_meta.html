{# Balises de partage (LinkedIn, Facebook, X, messageries).
   Variables attendues : og_title, og_description, og_url ; optionnelles : og_image, og_image_alt, og_type. #}
{% set _og_image = og_image or (site_url ~ '/static/img/og-retroplanning.png') %}
<meta property="og:site_name" content="Rétroplanning.eu">
<meta property="og:locale" content="fr_FR">
<meta property="og:type" content="{{ og_type or 'website' }}">
<meta property="og:title" content="{{ og_title }}">
<meta property="og:description" content="{{ og_description }}">
<meta property="og:url" content="{{ og_url }}">
<meta property="og:image" content="{{ _og_image }}">
{% if not og_image %}<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">{% endif %}
<meta property="og:image:alt" content="{{ og_image_alt or 'Exemple de rétroplanning généré avec Rétroplanning.eu' }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ og_title }}">
<meta name="twitter:description" content="{{ og_description }}">
<meta name="twitter:image" content="{{ _og_image }}">
