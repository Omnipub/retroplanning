<!DOCTYPE html>
<html lang="fr">
<head>
    {% if ga_id %}  
<!-- Google tag (gtag.js) -->  
<script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_id }}"></script>  
<script>  
  window.dataLayer = window.dataLayer || [];  
  function gtag(){dataLayer.push(arguments);}  
  gtag('js', new Date());  
  gtag('config', '{{ ga_id }}');  
</script>  
{% endif %}
    <meta charset="UTF-8">
    <title>Paiement annulé</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="{{ site_url }}/cancel">
    <link rel="icon" href="/static/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png"><link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16x16.png"><link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png"><link rel="stylesheet" href="/static/css/tailwind.css">
</head>
<body class="p-8 bg-slate-50">
    <div class="max-w-xl mx-auto text-center bg-white rounded-xl shadow p-10 mt-10">
        <h1 class="text-2xl font-bold text-red-500 mb-4">Paiement annulé</h1>
        <p class="text-slate-500 mb-6">Aucun montant n'a été débité. Vous pouvez réessayer quand vous le souhaitez.</p>

</html>
